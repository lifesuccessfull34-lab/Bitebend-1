<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Mobile browser compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Bitebend Portal</title>
    <!--
      favicon: relative path so it resolves correctly under any base path
      (/portal/favicon.svg in production, /favicon.svg in dev).
    -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Chatzy AI customer support widget stylesheet (script injected via ChatzyWidget component) -->
    <link rel="stylesheet" href="https://chatzy-kb-store.s3.amazonaws.com/icons/5ab07987-b5db-477c-82ff-1287e0883acb"/>
    <!--
      Google Fonts — loaded asynchronously so it NEVER blocks first paint.
      The preconnect hints start the DNS/TLS handshake early. The font
      stylesheet uses the "preload as style + onload" pattern to become
      non-render-blocking. A <noscript> fallback serves JS-disabled browsers.
    -->
    <!--
      Google Fonts — loaded ASYNC so fonts never block first paint.
      Loading "Plus Jakarta Sans" because that is what the app CSS actually uses
      (--app-font-sans). The previous "Inter" link was loading the wrong font.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <meta name="theme-color" content="#f97316" />
    <style>
      /* Inline loading screen — visible immediately before JS loads.
         Prevents the blank white screen perception on slow mobile connections.
         Uses explicit top/right/bottom/left instead of the `inset` shorthand —
         `inset` is not supported on Android < 10 or Samsung Internet < 12. */
      #app-loading {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: -webkit-box;
        display: -webkit-flex;
        display: flex;
        -webkit-box-align: center;
        -webkit-align-items: center;
        align-items: center;
        -webkit-box-pack: center;
        -webkit-justify-content: center;
        justify-content: center;
        -webkit-box-orient: vertical;
        -webkit-box-direction: normal;
        -webkit-flex-direction: column;
        flex-direction: column;
        gap: 16px;
        background: #fff8f5;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        z-index: 9999;
      }
      #app-loading .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #ffe5d0;
        border-top-color: #f97316;
        border-radius: 50%;
        -webkit-animation: spin 0.8s linear infinite;
        animation: spin 0.8s linear infinite;
      }
      #app-loading p {
        color: #888;
        font-size: 14px;
        margin: 0;
      }
      @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); transform: rotate(360deg); } }
      @keyframes spin { to { -webkit-transform: rotate(360deg); transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Loading screen: hidden by AuthContext once the auth check settles.
         Stays visible through the entire boot + auth sequence so there is
         never a blank frame between the HTML spinner and the React UI. -->
    <div id="app-loading">
      <div class="spinner"></div>
      <p>Loading Bitebend Portal…</p>
    </div>
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;font-family:sans-serif;text-align:center">
        <h2>JavaScript required</h2>
        <p>Please enable JavaScript in your browser to use Bitebend Portal.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Safety-net: if JS never executes or crashes before AuthContext can call
      window.__hideAppLoader__(), show a "Tap to reload" prompt.
      20 s — generous enough for slow Indian 4G connections where bundle
      download + parse can take 10–15 s before the auth check even starts.
      In practice AuthContext fires __hideAppLoader__ within ~2–6 s on a
      normal connection.
    -->
    <script>
      (function () {
        var TIMEOUT = 20000;
        var timer = setTimeout(function () {
          var el = document.getElementById('app-loading');
          if (!el) return;
          el.innerHTML =
            '<div style="text-align:center;padding:2rem 1.5rem;font-family:system-ui,-apple-system,sans-serif">' +
            '<p style="color:#555;font-size:15px;font-weight:600;margin:0 0 6px">Slow to load?</p>' +
            '<p style="color:#aaa;font-size:12px;margin:0 0 20px;line-height:1.5">Check your internet connection,<br>then tap the button below.</p>' +
            '<button onclick="location.reload()" style="background:#f97316;color:#fff;border:none;' +
            'border-radius:10px;padding:14px 32px;font-size:15px;font-weight:600;cursor:pointer;' +
            'font-family:inherit;box-shadow:0 4px 14px rgba(249,115,22,0.35)">' +
            'Tap to Reload' +
            '</button></div>';
        }, TIMEOUT);
        window.__clearAppLoadingTimer__ = function () { clearTimeout(timer); };
      })();
    </script>
  </body>
</html>
